<svg fill="none" viewBox="0 0 800 300" width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          background-image: url('https://raw.githubusercontent.com/Naksu14/Naksu14/main/myBanner.jpg');
          background-size: cover;
          background-position: center;
          width: 800px;
          height: 300px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .typing {
          color: white;
          font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          font-size: 55px;
          font-weight: 800;
          white-space: nowrap;
          overflow: hidden;
          width: 0;
          border-right: 4px solid white;
          /* Adjusting the width to fit the text exactly */
          animation: typing 3s steps(15) forwards, blink 0.7s infinite;
          text-shadow: 0px 4px 12px rgba(0,0,0,0.9);
        }
        @keyframes typing { 
          from { width: 0 } 
          /* 460px is roughly the width of "LOEL CAMPAÑA" at this font size */
          to { width: 460px } 
        }
        @keyframes blink { 
          50% { border-color: transparent } 
        }
      </style>
      <div class="container">
        <div class="typing">LOEL CAMPAÑA</div>
      </div>
    </div>
  </foreignObject>
</svg>
