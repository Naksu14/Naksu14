<svg fill="none" viewBox="0 0 800 300" width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          background-image: url('https://raw.githubusercontent.com/Naksu14/Naksu14/main/myBanner.jpg');
          background-size: cover;
          background-position: center;
          width: 800px;
          height: 300px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .typing {
          color: white;
          font-size: 45px;
          font-weight: bold;
          overflow: hidden;
          border-right: .15em solid orange;
          white-space: nowrap;
          margin: 0 auto;
          letter-spacing: .15em;
          animation: 
            typing 3.5s steps(30, end),
            blink-caret .5s step-end infinite;
          text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        @keyframes typing {
          from { width: 0 }
          to { width: 100% }
        }
        @keyframes blink-caret {
          from, to { border-color: transparent }
          50% { border-color: white }
        }
      </style>
      <div class="container">
        <div class="typing">LOEL CAMPAÑA</div>
      </div>
    </div>
  </foreignObject>
</svg>
